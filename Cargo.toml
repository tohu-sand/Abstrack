[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
lopdf = { version = "=0.47.0", default-features = false }
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_8125"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
