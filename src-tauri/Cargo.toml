[package]
name = "abstrack"
version = "0.1.0"
description = "PDF reader for reviewing and revising manuscripts"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde.workspace = true
serde_json.workspace = true
pdf_io = { path = "../crates/pdf_io" }
annot = { path = "../crates/annot" }
render = { path = "../crates/render" }
textmodel = { path = "../crates/textmodel" }
flate2 = { version = "=1.1.11", features = ["zlib-rs"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_WindowsAndMessaging"] }
